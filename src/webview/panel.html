<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MundiCodeLens AI</title>

    <link rel="stylesheet" href="{{styleUri}}" />
  </head>

  <body>
    <div class="container">
      <!-- 🔹 Header -->

      <div class="hero">
        <div class="hero-top">
          <div class="logo">🚀</div>

          <div>
            <h1>MundiCodeLens AI</h1>

            <p class="hero-subtitle">Context-aware AI engineering assistant</p>
          </div>
        </div>
      </div>

      <!-- 🔹 Source Code Section -->

      <div class="section">
        <div class="section-top">
          <div class="badge">SOURCE</div>
        </div>

        <h2>📌 Selected Code</h2>

        <div class="code-card">
          <pre><code>{{code}}</code></pre>
        </div>
      </div>

      <!-- 🔹 AI Analysis -->

      <div class="section">
        <div class="section-top">
          <div class="badge">{{badge}}</div>
        </div>

        <h2>{{panelTitle}}</h2>

        <p class="subtitle">{{panelSubtitle}}</p>

        <div class="response-card">
          <div class="response">{{response}}</div>
        </div>
      </div>

      <!-- 🔹 Footer -->

      <div class="footer">
        <p>MundiCodeLens Lite • AI-assisted engineering workflow</p>
      </div>
    </div>
  </body>
</html>
